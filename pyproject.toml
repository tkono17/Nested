[project]
name = "Nested"
version = "0.0.1"
description = "Application core for multiple project management"
authors = [
    { name = "Takanori Kono", email = "takanori.kono@gmail.com" }
]
require-python = ">=3.10"
dependencies = [
    "dotenv",
    "typer",
    "import-linter",
    "sqlmodel",
    "fire",
    "fastapi",
    "appbasics @ git+https://github.com/tkono17/appbasics"
]

[project.scripts]
#nested-cli = "nested.cli.main:main"
nested-db = "nested.cli.nestedDb:main"

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [ "src/nested" ]

